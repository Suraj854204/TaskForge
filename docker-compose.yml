services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskforge
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      AI_API_KEY: ${AI_API_KEY:-}

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "8080:80"

volumes:
  mongo-data:
