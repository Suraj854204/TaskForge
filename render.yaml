# Render Blueprint: deploys the API. The client is deployed separately on Vercel.
services:
  - type: web
    name: taskforge-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev so TypeScript is available during the build; tsc still emits JS if it reports type errors
    buildCommand: npm install --include=dev && (npm run build; test -f dist/server.js)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # paste your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false          # your Vercel URL, e.g. https://taskforge.vercel.app
      - key: AI_API_KEY
        sync: false          # optional
